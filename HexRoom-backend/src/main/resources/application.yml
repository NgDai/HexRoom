server:
  port: ${PORT:8080}

spring:
  application:
    name: hexroom-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-0-ap-northeast-1.pooler.supabase.com:5432/postgres?sslmode=require}
    username: ${SPRING_DATASOURCE_USERNAME:postgres.rbgzudaemwmmiyihsrbj}
    password: ${SPRING_DATASOURCE_PASSWORD:EXE101PASSABC}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      max-lifetime: 60000
      connection-timeout: 30000
      connection-test-query: SELECT 1

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 20MB

app:
  jwt:
    # Must be at least 256 bits (32 bytes) for HS256
    secret: ${JWT_SECRET:hexroom_very_secret_jwt_key_that_is_at_least_32_characters_long_1234567890}
    access-token-expiration-ms: ${JWT_EXPIRES_IN_MS:900000} # 15 minutes
    refresh-token-expiration-ms: ${REFRESH_TOKEN_EXPIRES_IN_MS:604800000} # 7 days
    cookie-name: ${REFRESH_TOKEN_COOKIE_NAME:hexroom_refresh_token}

  cors:
    allowed-origins: ${CORS_ORIGIN:http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
